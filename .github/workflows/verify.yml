name: KubeSecLab offline fixture tests
on:
  push:
  pull_request:
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/setup.sh scripts/verify.sh scripts/cleanup.sh
