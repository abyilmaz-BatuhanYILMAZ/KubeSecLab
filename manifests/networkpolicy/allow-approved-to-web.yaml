# Only clients with access=approved in the same namespace may reach web:8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-to-web
  namespace: kubesec-net
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: approved
      ports:
        - protocol: TCP
          port: 8080
