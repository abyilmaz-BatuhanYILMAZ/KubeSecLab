apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-reader
  namespace: kubesec-training
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: kubesec-training
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: kubesec-training
subjects:
  - kind: ServiceAccount
    name: demo-reader
    namespace: kubesec-training
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
